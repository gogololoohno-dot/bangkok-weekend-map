html, body { height:100%; font-family:'Segoe UI',system-ui,sans-serif; background:#111827; color:#f9fafb; overflow:hidden; }
body { display:flex; flex-direction:column; }

header {
  background:#1f2937; border-bottom:1px solid #374151;
  padding:11px 18px; display:flex; align-items:center; gap:10px; flex-shrink:0;
}
.htitle { font-size:1rem; font-weight:700; }
.hsub { font-size:0.7rem; color:#cbd5e1; }
.badge { margin-left:auto; background:#f97316; color:#fff; font-size:0.65rem; font-weight:700; padding:3px 10px; border-radius:20px; }

.filters {

  padding:7px 14px; display:flex; gap:5px; flex-wrap:nowrap; align-items:center; flex-shrink:0;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.filters::-webkit-scrollbar { display:none; }
.filters label { font-size:0.65rem; color:#e2e8f0; flex-shrink:0; }
.pill {
  font-size:0.62rem; font-weight:600; padding:3px 9px; border-radius:20px;
  border:1px solid #374151; background:#111827; color:#d1d5db; cursor:pointer; transition:all 0.15s;
  user-select:none;
}
.pill:hover { border-color:#9ca3af; }
.pill.on { color:#fff; }
.pill[data-f="all"].on       { background:#f97316; border-color:#f97316; }
.pill[data-f="art"].on       { background:#8b5cf6; border-color:#8b5cf6; }
.pill[data-f="music"].on     { background:#3b82f6; border-color:#3b82f6; }
.pill[data-f="pop-up"].on    { background:#ef4444; border-color:#ef4444; }
.pill[data-f="film"].on      { background:#10b981; border-color:#10b981; }
.pill[data-f="market"].on    { background:#f59e0b; border-color:#f59e0b; }
.pill[data-f="aquarium"].on  { background:#06b6d4; border-color:#06b6d4; }
.pill[data-f="nature"].on    { background:#22c55e; border-color:#22c55e; }
.pill[data-f="nightlife"].on { background:#a855f7; border-color:#a855f7; }
.pill[data-f="community"].on { background:#f43f5e; border-color:#f43f5e; }

/* City tabs */
.city-tabs {
  background:#111827; border-bottom:1px solid #374151;
  padding:5px 14px; display:flex; gap:5px; flex-shrink:0;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.city-tabs::-webkit-scrollbar { display:none; }
.ctab {
  font-size:0.67rem; font-weight:700; padding:4px 12px; border-radius:20px;
  border:1px solid #374151; background:#1f2937; color:#9ca3af;
  cursor:pointer; user-select:none; flex-shrink:0; transition:all 0.15s;
}
.ctab:hover { border-color:#9ca3af; color:#e2e8f0; }
.ctab.on { background:#f97316; border-color:#f97316; color:#fff; }

.layout { display:flex; flex:1; min-height:0; }

aside {
  width:310px; min-width:310px; overflow-y:auto;
  background:#0f172a; border-right:1px solid #1e293b;
}
aside::-webkit-scrollbar { width:3px; }
aside::-webkit-scrollbar-thumb { background:#374151; border-radius:3px; }

/* ── Mobile ── */
@media (max-width:640px) {
  header { padding:10px 14px; }
  .htitle { font-size:0.9rem; }
  .hsub { display:none; }

  .layout { flex-direction:column-reverse; }

  aside {
    width:100%; min-width:0;
    height:42vh; border-right:none; border-top:1px solid #1e293b;
  }

  .card-img { height:90px; }
  .card-desc { display:none; } /* hide long desc on mobile cards */

  #map-wrap { height:58vh; }

  /* Marker labels hidden on mobile — too cluttered */
  .mpin-label { display:none; }
  /* Bigger tap targets */
  .mpin-dot { width:40px; height:40px; font-size:18px; }

  /* Popup anchors to bottom of map */
  #popup {
    position:fixed !important;
    bottom:44vh !important; top:auto !important;
    left:10px !important; right:10px !important;
    width:auto !important;
    border-radius:14px;
  }

  .zbtn { width:38px; height:38px; font-size:1.3rem; }
}

.card { border-bottom:1px solid #1e293b; cursor:pointer; transition:background 0.12s; }
.card:hover { background:#1e293b; }
.card.active { background:#1e293b; border-left:3px solid #f97316; }
.card.hide { display:none; }
.card-img { width:100%; height:110px; object-fit:cover; display:block; background:#1f2937; }
.card-body { padding:9px 12px 11px; }
.ctag {
  display:inline-block; font-size:0.58rem; font-weight:700; padding:2px 7px; border-radius:10px;
  text-transform:uppercase; letter-spacing:0.3px; margin-bottom:5px;
}
.tag-art       { background:#4c1d95; color:#c4b5fd; }
.tag-music     { background:#1e3a8a; color:#93c5fd; }
.tag-pop-up    { background:#7f1d1d; color:#fca5a5; }
.tag-film      { background:#064e3b; color:#6ee7b7; }
.tag-market    { background:#78350f; color:#fcd34d; }
.tag-aquarium  { background:#0c4a6e; color:#67e8f9; }
.tag-nature    { background:#14532d; color:#86efac; }
.tag-nightlife { background:#2e1065; color:#e9d5ff; }
.tag-community { background:#881337; color:#fda4af; }

.card-title { font-size:0.8rem; font-weight:700; color:#f9fafb; margin-bottom:4px; line-height:1.3; }
.card-meta { font-size:0.68rem; color:#e2e8f0; display:flex; flex-direction:column; gap:3px; }
.card-meta span { display:flex; align-items:flex-start; gap:4px; }
.green { color:#4ade80; font-weight:700; }
.amber { color:#fcd34d; font-weight:700; }
.card-desc { font-size:0.72rem; color:#f1f5f9; margin-top:6px; line-height:1.6; }

/* Map */
#map-wrap { flex:1; position:relative; min-width:0; min-height:0; overflow:hidden; background:#1a2035; cursor:grab; }
#map-wrap.dragging { cursor:grabbing; }
#tile-layer { position:absolute; top:0; left:0; }
#tile-layer img { position:absolute; width:256px; height:256px; display:block; image-rendering:auto; }
#marker-layer { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
#map-content { position:absolute; top:0; left:0; width:100%; height:100%; }
.mpin {
  position:absolute; pointer-events:all; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transform:translate(-50%,-50%);
  transition:transform 0.15s;
  z-index:10;
  white-space:nowrap;
}
.mpin:hover { transform:translate(-50%,-50%) scale(1.05); z-index:20; }
.mpin.hidden { display:none; }
.mpin-dot {
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.55);
}
.mpin-label {
  background:rgba(15,23,42,0.85);
  color:#f9fafb; font-size:0.62rem; font-weight:600;
  padding:3px 7px; border-radius:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
  backdrop-filter:blur(4px);
  line-height:1.3; max-width:150px; white-space:normal;
  pointer-events:none;
}

/* Zoom controls */
#zoom-btns { position:absolute; top:10px; right:10px; z-index:50; display:flex; flex-direction:column; gap:4px; }
.zbtn {
  width:32px; height:32px; background:#1f2937; border:1px solid #374151; color:#f9fafb;
  font-size:1.1rem; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  user-select:none;
}
.zbtn:hover { background:#374151; }

/* Popup */
#popup {
  position:absolute; z-index:100; background:#1f2937; border:1px solid #374151;
  border-radius:10px; width:240px; box-shadow:0 8px 32px rgba(0,0,0,0.7);
  display:none;
}
#popup img { width:100%; height:85px; object-fit:cover; border-radius:10px 10px 0 0; display:block; }
#popup-body { padding:10px 12px 12px; }
#popup-body h3 { font-size:0.78rem; font-weight:700; color:#f9fafb; margin-bottom:5px; }
#popup-meta { font-size:0.65rem; color:#9ca3af; display:flex; flex-direction:column; gap:2px; }
#popup-close {
  position:absolute; top:6px; right:8px; background:rgba(0,0,0,0.6); color:#fff;
  border:none; border-radius:50%; width:22px; height:22px; cursor:pointer;
  font-size:0.75rem; display:flex; align-items:center; justify-content:center; z-index:10;
}

/* Attribution */
#attr {
  position:absolute; bottom:4px; right:6px; z-index:50;
  font-size:0.55rem; color:#6b7280; background:rgba(15,23,42,0.8); padding:2px 5px; border-radius:3px;
}
#attr a { color:#6b7280; }

/* BAC Passport Art Trail */
.pill[data-f="bac"].on { background:#e11d48; border-color:#e11d48; }
.bpin {
  position:absolute; pointer-events:all; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transform:translate(-50%,-50%);
  transition:transform 0.15s;
  z-index:8; white-space:nowrap;
}
.bpin:hover { transform:translate(-50%,-50%) scale(1.1); z-index:18; }
.bpin.bpin-hidden { display:none; }
.bpin-dot {
  width:28px; height:28px; border-radius:5px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; border:2px solid rgba(255,255,255,0.9);
  background:#e11d48;
  box-shadow:0 2px 8px rgba(0,0,0,0.55);

.bpin-label {
  background:rgba(225,29,72,0.88); color:#fff;
  font-size:0.56rem; font-weight:700;
  padding:2px 6px; border-radius:5px;

  pointer-events:none;
  max-width:130px; white-space:normal; line-height:1.3;
}
@media (max-width:640px) {
  .bpin-label { display:none; }
  .bpin-dot { width:36px; height:36px; font-size:16px; }
}
</style>

// ── City config ───────────────────────────────────────────────────────────────
var CITY_CONFIG = {
  bangkok:   { name:'Bangkok',   lat:13.748,  lng:100.520, zoom:13, source:'Timeout Bangkok'   },

  hongkong:  { name:'Hong Kong', lat:22.315,  lng:114.168, zoom:13, source:'Timeout Hong Kong' }
};
function getCityData(city) {
  if (city === 'bangkok')   return A_BANGKOK;
  if (city === 'singapore') return A_SINGAPORE;
  if (city === 'tokyo')     return A_TOKYO;
  if (city === 'hongkong')  return A_HONGKONG;
  return [];
}
function getCityLabel(city) {
  if (city === 'bangkok')   return LABEL_BANGKOK;
  if (city === 'singapore') return LABEL_SINGAPORE;
  if (city === 'tokyo')     return LABEL_TOKYO;
  if (city === 'hongkong')  return LABEL_HONGKONG;
  return '';
}
var currentCity = 'bangkok';
var A = getCityData('bangkok');

// ── Map Engine ────────────────────────────────────────────────────────────────
var TILE = 256;
var zoom = CITY_CONFIG[currentCity].zoom;
var centerLat = CITY_CONFIG[currentCity].lat, centerLng = CITY_CONFIG[currentCity].lng;

var wrap = document.getElementById('map-wrap');
var tileLayer = document.getElementById('tile-layer');
var markerLayer = document.getElementById('marker-layer');
var mapContent = document.getElementById('map-content');
var zoomAnimating = false;

function deg2rad(d) { return d * Math.PI / 180; }

// World pixel coords at current zoom
function lngToWX(lng) { return ((lng + 180) / 360) * Math.pow(2, zoom) * TILE; }
function latToWY(lat) {
  var r = deg2rad(lat);
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, zoom) * TILE;
}

// Screen pixel from world pixel
function wx2sx(wx) { return wx - lngToWX(centerLng) + wrap.clientWidth / 2; }
function wy2sy(wy) { return wy - latToWY(centerLat) + wrap.clientHeight / 2; }

var loadedTiles = {};

function renderTiles() {
  var cWX = lngToWX(centerLng);
  var cWY = latToWY(centerLat);
  var W = wrap.clientWidth, H = wrap.clientHeight;

  var tileTotal = Math.pow(2, zoom);
  var tileXCenter = cWX / TILE;
  var tileYCenter = cWY / TILE;

  var tilesX = Math.ceil(W / TILE / 2) + 2;
  var tilesY = Math.ceil(H / TILE / 2) + 2;

  var needed = {};

  for (var tx = Math.floor(tileXCenter) - tilesX; tx <= Math.ceil(tileXCenter) + tilesX; tx++) {
    for (var ty = Math.floor(tileYCenter) - tilesY; ty <= Math.ceil(tileYCenter) + tilesY; ty++) {
      var wtx = ((tx % tileTotal) + tileTotal) % tileTotal;
      var wty = ty;
      if (wty < 0 || wty >= tileTotal) continue;

      var key = zoom + '/' + wtx + '/' + wty;
      needed[key] = { tx: tx, ty: ty, wtx: wtx, wty: wty };
    }
  }

  // Position existing tiles, add missing ones
  Object.keys(needed).forEach(function(key) {
    var info = needed[key];
    var px = info.tx * TILE - cWX + W / 2;
    var py = info.ty * TILE - cWY + H / 2;

    if (loadedTiles[key]) {
      loadedTiles[key].style.left = px + 'px';
      loadedTiles[key].style.top  = py + 'px';
    } else {
      var img = document.createElement('img');
      img.style.left = px + 'px';
      img.style.top  = py + 'px';
      // Round-robin subdomain a/b/c
      var sub = ['a','b','c'][(info.wtx + info.wty) % 3];
      // CartoDB Voyager — English labels, Google Maps-like colours, reliable
      var sub = ['a','b','c','d'][(info.wtx + info.wty) % 4];
      img.src = 'https://' + sub + '.basemaps.cartocdn.com/rastertiles/voyager/' + zoom + '/' + info.wtx + '/' + info.wty + '.png';
      img.onerror = function() { this.style.background = '#1a2035'; };
      tileLayer.appendChild(img);
      loadedTiles[key] = img;
    }
  });

  // Remove tiles no longer needed
  Object.keys(loadedTiles).forEach(function(key) {
    if (!needed[key]) {
      tileLayer.removeChild(loadedTiles[key]);
      delete loadedTiles[key];
    }
  });
}

function renderMarkers() {
  var cWX = lngToWX(centerLng);
  var cWY = latToWY(centerLat);
  var W = wrap.clientWidth, H = wrap.clientHeight;

  A.forEach(function(a) {
    var pin = document.getElementById('pin-' + a.id);
    if (!pin) return;
    if (pin.classList.contains('hidden')) { pin.style.display = 'none'; return; }
    pin.style.display = '';

    var wx = lngToWX(a.lng);
    var wy = latToWY(a.lat);
    var sx = wx - cWX + W / 2;
    var sy = wy - cWY + H / 2;
    pin.style.left = sx + 'px';
    pin.style.top  = sy + 'px';
  });
}

function render() {
  renderTiles();
  renderMarkers();
}

// ── Create markers ────────────────────────────────────────────────────────────
function buildMarkers() {
  markerLayer.querySelectorAll('.mpin').forEach(function(p) { p.remove(); });
  A.forEach(function(a) {
    var pin = document.createElement('div');
    pin.className = 'mpin';
    pin.id = 'pin-' + a.id;
    pin.innerHTML =
      '<div class="mpin-dot" style="background:' + (COLORS[a.cat]||'#888') + '">' + a.e + '</div>' +
      '<div class="mpin-label">' + a.title + '</div>';
    pin.addEventListener('click', function(e) {
      e.stopPropagation();
      showPopup(a);
      highlightCard(a.id);
    });
    markerLayer.appendChild(pin);
  });
}

// ── Popup ─────────────────────────────────────────────────────────────────────
var popup = document.getElementById('popup');
var popupImg = document.getElementById('popup-img');
var popupTitle = document.getElementById('popup-title');
var popupMeta = document.getElementById('popup-meta');

function showPopup(a) {
  if (a.img) {
    popupImg.src = a.img;
    popupImg.style.display = '';
  } else {
    popupImg.src = '';
    popupImg.style.display = 'none';
  }
  popupTitle.textContent = a.title;
  popupMeta.innerHTML =
    '<span>🕐 ' + a.time + '</span>' +
    '<span>📍 ' + a.loc + '</span>' +
    '<span class="' + (a.free ? 'green' : 'amber') + '">💰 ' + a.price + '</span>' +
    '<span style="color:#4b5563">📅 ' + a.until + '</span>';

  // Position near the pin
  var pin = document.getElementById('pin-' + a.id);
  var pw = 240, ph = 180;
  var W = wrap.clientWidth, H = wrap.clientHeight;
  var px = parseFloat(pin.style.left);
  var py = parseFloat(pin.style.top);

  var left = px + 22;
  var top  = py - ph / 2;
  if (left + pw > W - 10) left = px - pw - 22;
  if (top < 10) top = 10;
  if (top + ph > H - 10) top = H - ph - 10;

  popup.style.left = left + 'px';
  popup.style.top  = top + 'px';
  popup.style.display = 'block';
}

document.getElementById('popup-close').addEventListener('click', function() {
  popup.style.display = 'none';
});
wrap.addEventListener('click', function() { popup.style.display = 'none'; });

// ── Pan & drag ────────────────────────────────────────────────────────────────
var drag = { on: false, startX: 0, startY: 0, dx: 0, dy: 0 };
var inertiaRaf = null;
var velSamples = [];  // recent {dx, dy, t} for velocity estimation

// Shift centerLat/Lng by screen pixels (correct directions)
function shiftCenter(dx, dy) {
  var scale = 360 / (Math.pow(2, zoom) * TILE);
  centerLng -= dx * scale;
  var latRad = deg2rad(centerLat);
  var merc = Math.log(Math.tan(latRad) + 1 / Math.cos(latRad));
  // +dy because screen Y and map Y are both positive-downward here
  var newMerc = merc + (dy / (Math.pow(2, zoom) * TILE)) * 2 * Math.PI;
  centerLat = Math.atan(Math.sinh(newMerc)) * 180 / Math.PI;
}

function startDrag(x, y) {
  if (inertiaRaf) { cancelAnimationFrame(inertiaRaf); inertiaRaf = null; }
  mapContent.style.transition = '';  // cancel any in-flight zoom animation
  drag.on = true;
  drag.startX = x; drag.startY = y;
  drag.dx = 0; drag.dy = 0;
  velSamples = [];
  wrap.classList.add('dragging');
}
function moveDrag(x, y) {
  if (!drag.on) return;
  drag.dx = x - drag.startX;
  drag.dy = y - drag.startY;
  var t = 'translate(' + drag.dx + 'px,' + drag.dy + 'px)';
  mapContent.style.transform = t;
  var now = Date.now();
  velSamples.push({ dx: drag.dx, dy: drag.dy, t: now });
  velSamples = velSamples.filter(function(s) { return now - s.t < 80; });
}
function endDrag() {
  if (!drag.on) return;
  drag.on = false;
  wrap.classList.remove('dragging');
  mapContent.style.transform = '';
  shiftCenter(drag.dx, drag.dy);
  render();

  var vx = 0, vy = 0;
  if (velSamples.length >= 2) {
    var a = velSamples[0], b = velSamples[velSamples.length - 1];
    var dt = Math.max(b.t - a.t, 1);
    vx = (b.dx - a.dx) / dt * 16;
    vy = (b.dy - a.dy) / dt * 16;
  }
  if (Math.abs(vx) > 0.8 || Math.abs(vy) > 0.8) {
    (function glide() {
      vx *= 0.88; vy *= 0.88;
      if (Math.abs(vx) < 0.4 && Math.abs(vy) < 0.4) return;
      shiftCenter(vx, vy); render();
      inertiaRaf = requestAnimationFrame(glide);
    })();
  }
}

// Mouse
wrap.addEventListener('mousedown', function(e) {
  if (e.target.closest('.mpin') || e.target.closest('.bpin') || e.target.closest('#popup') || e.target.closest('#zoom-btns')) return;
  startDrag(e.clientX, e.clientY);
  e.preventDefault();
});
window.addEventListener('mousemove', function(e) { moveDrag(e.clientX, e.clientY); });
window.addEventListener('mouseup', endDrag);

// Touch — single-finger pan + two-finger pinch-to-zoom
var pinch = { on: false, initDist: 1, midX: 0, midY: 0 };

function getTouchDist(touches) {
  var dx = touches[0].clientX - touches[1].clientX;
  var dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

wrap.addEventListener('touchstart', function(e) {
  if (e.target.closest('.mpin') || e.target.closest('.bpin') || e.target.closest('#popup') || e.target.closest('#zoom-btns')) return;
  if (e.touches.length === 2) {
    // A second finger arrived — commit any in-progress single drag and start pinch
    if (drag.on) {
      drag.on = false;
      wrap.classList.remove('dragging');
      mapContent.style.transform = '';
      shiftCenter(drag.dx, drag.dy);
    }
    var rect = wrap.getBoundingClientRect();
    pinch.on = true;
    pinch.initDist = getTouchDist(e.touches);
    pinch.midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
    pinch.midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
    e.preventDefault();
  } else if (e.touches.length === 1 && !pinch.on) {
    startDrag(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

wrap.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (e.touches.length === 2 && pinch.on) {
    var scale = getTouchDist(e.touches) / pinch.initDist;
    mapContent.style.transformOrigin = pinch.midX + 'px ' + pinch.midY + 'px';
    mapContent.style.transform = 'scale(' + scale + ')';
  } else if (e.touches.length === 1 && drag.on) {
    moveDrag(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

wrap.addEventListener('touchend', function(e) {
  if (pinch.on) {
    if (e.touches.length >= 2) return;  // still two or more fingers down
    pinch.on = false;

    // Read the scale that was visually applied
    var m = mapContent.style.transform.match(/scale\(([^)]+)\)/);
    var scale = m ? parseFloat(m[1]) : 1;
    mapContent.style.transform = '';
    mapContent.style.transformOrigin = '';

    // Snap to nearest integer zoom level
    var newZoom = Math.round(zoom + Math.log2(scale));
    newZoom = Math.min(17, Math.max(10, newZoom));
    if (newZoom !== zoom) {
      var W = wrap.clientWidth, H = wrap.clientHeight;
      var scaleFactor = Math.pow(2, newZoom - zoom);
      var dx = pinch.midX - W / 2;
      var dy = pinch.midY - H / 2;
      var cWX = lngToWX(centerLng);
      var cWY = latToWY(centerLat);
      zoom = newZoom;
      var newCWX = (cWX + dx) * scaleFactor - dx;
      var newCWY = (cWY + dy) * scaleFactor - dy;
      var tileTotal = Math.pow(2, zoom);
      centerLng = Math.max(-180, Math.min(180, newCWX / (TILE * tileTotal) * 360 - 180));
      var n = Math.PI - 2 * Math.PI * newCWY / (TILE * tileTotal);
      centerLat = Math.atan(Math.sinh(n)) * 180 / Math.PI;
    }
    loadedTiles = {};
    tileLayer.innerHTML = '';
    render();
  } else {
    endDrag();
  }
});

// ── Zoom ─────────────────────────────────────────────────────────────────────
function changeZoom(delta, originX, originY) {
  if (zoomAnimating) return;
  var newZoom = Math.min(17, Math.max(10, zoom + delta));
  if (newZoom === zoom) return;

  var W = wrap.clientWidth, H = wrap.clientHeight;
  var ox = (originX !== undefined) ? originX : W / 2;
  var oy = (originY !== undefined) ? originY : H / 2;
  var scaleFactor = Math.pow(2, delta);

  // Shift center so the point under (ox, oy) stays fixed after zoom
  var cWX = lngToWX(centerLng);
  var cWY = latToWY(centerLat);
  var dx = ox - W / 2;
  var dy = oy - H / 2;
  zoom = newZoom;
  var newCWX = (cWX + dx) * scaleFactor - dx;
  var newCWY = (cWY + dy) * scaleFactor - dy;
  var tileTotal = Math.pow(2, zoom);
  centerLng = Math.max(-180, Math.min(180, newCWX / (TILE * tileTotal) * 360 - 180));
  var n = Math.PI - 2 * Math.PI * newCWY / (TILE * tileTotal);
  centerLat = Math.atan(Math.sinh(n)) * 180 / Math.PI;

  // Animate scale from origin, then swap tiles at the new zoom
  zoomAnimating = true;
  mapContent.style.transformOrigin = ox + 'px ' + oy + 'px';
  mapContent.style.transition = 'transform 0.18s ease-out';
  mapContent.style.transform = 'scale(' + scaleFactor + ')';
  setTimeout(function() {
    mapContent.style.transition = '';
    mapContent.style.transform = '';
    mapContent.style.transformOrigin = '';
    loadedTiles = {};
    tileLayer.innerHTML = '';
    render();
    zoomAnimating = false;
  }, 180);
}

document.getElementById('btn-in').addEventListener('click', function() { changeZoom(1); });
document.getElementById('btn-out').addEventListener('click', function() { changeZoom(-1); });

wrap.addEventListener('wheel', function(e) {
  e.preventDefault();
  var rect = wrap.getBoundingClientRect();
  changeZoom(e.deltaY < 0 ? 1 : -1, e.clientX - rect.left, e.clientY - rect.top);
}, { passive: false });

// ── Sidebar ───────────────────────────────────────────────────────────────────
var sidebar = document.getElementById('sidebar');

function buildSidebar() {
  sidebar.innerHTML = '';
  A.forEach(function(a) {
    var el = document.createElement('div');
    el.className = 'card';
    el.id = 'card-' + a.id;
    el.dataset.cat = a.cat;
    el.innerHTML =
      '<img class="card-img" src="' + a.img + '" alt="" onerror="this.style.display=\'none\'">' +
      '<div class="card-body">' +
        '<span class="ctag tag-' + a.cat + '">' + a.e + ' ' + a.cat + '</span>' +
        '<div class="card-title">' + a.title + '</div>' +
        '<div class="card-meta">' +
          '<span>🕐 ' + a.time + '</span>' +
          '<span>📍 ' + a.loc + '</span>' +
          '<span class="' + (a.free ? 'green' : 'amber') + '">💰 ' + a.price + '</span>' +
          '<span style="color:#4b5563">📅 ' + a.until + '</span>' +
        '</div>' +
        '<div class="card-desc">' + a.desc + '</div>' +
      '</div>';
    el.addEventListener('click', function() { flyTo(a); });
    sidebar.appendChild(el);
  });
}

function switchCity(city) {
  currentCity = city;
  A = getCityData(city);
  var cfg = CITY_CONFIG[city];

  // Update map center
  centerLat = cfg.lat; centerLng = cfg.lng; zoom = cfg.zoom;

  // Update header
  document.getElementById('city-title').textContent = cfg.name + ' This Weekend';
  document.getElementById('city-sub').textContent =
    A.length + ' picks · ' + cfg.source + ' · ' + getCityLabel(city);

  // Update "All N" pill
  document.querySelector('.pill[data-f="all"]').textContent = 'All ' + A.length;

  // Reset category filter
  document.querySelectorAll('.pill:not([data-f="bac"])').forEach(function(p) { p.classList.remove('on'); });
  document.querySelector('.pill[data-f="all"]').classList.add('on');

  // BAC trail: only available on Bangkok
  var bacPill = document.querySelector('.pill[data-f="bac"]');
  if (bacPill) {
    var showBac = city === 'bangkok' && BAC_ACTIVE;
    bacPill.style.display = showBac ? '' : 'none';
    if (!showBac && bacVisible) {
      bacVisible = false;
      bacPill.classList.remove('on');
      BAC.forEach(function(b) {
        var pin = document.getElementById('bpin-' + b.id);
        if (pin) pin.classList.add('bpin-hidden');
      });
    }
  }

  // Rebuild sidebar and markers, close popup
  popup.style.display = 'none';
  buildMarkers();
  buildSidebar();

  // Reload map tiles
  loadedTiles = {};
  tileLayer.innerHTML = '';
  render();
}

// City tab click handlers
document.querySelectorAll('.ctab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.ctab').forEach(function(t) { t.classList.remove('on'); });
    tab.classList.add('on');
    switchCity(tab.dataset.city);
  });
});

function highlightCard(id) {
  document.querySelectorAll('.card').forEach(function(c) { c.classList.remove('active'); });
  var c = document.getElementById('card-' + id);
  if (c) { c.classList.add('active'); c.scrollIntoView({ behavior:'smooth', block:'nearest' }); }
}

function flyTo(a) {
  centerLat = a.lat;
  centerLng = a.lng;
  zoom = 15;
  loadedTiles = {};
  tileLayer.innerHTML = '';
  render();
  setTimeout(function() { showPopup(a); }, 80);
  highlightCard(a.id);
}

// ── Filters ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    var f = pill.dataset.f;
    if (f === 'bac') return; // handled separately below
    document.querySelectorAll('.pill:not([data-f="bac"])').forEach(function(p) { p.classList.remove('on'); });
    pill.classList.add('on');
    A.forEach(function(a) {
      var show = f === 'all' || a.cat === f;
      var card = document.getElementById('card-' + a.id);
      var pin = document.getElementById('pin-' + a.id);
      if (card) card.classList.toggle('hide', !show);
      if (pin) pin.classList.toggle('hidden', !show);
    });
    popup.style.display = 'none';

    if (f !== 'all') {
      var vis = A.filter(function(a) { return a.cat === f; });
      if (vis.length) {
        var lats = vis.map(function(a) { return a.lat; });
        var lngs = vis.map(function(a) { return a.lng; });
        centerLat = (Math.min.apply(null,lats) + Math.max.apply(null,lats)) / 2;
        centerLng = (Math.min.apply(null,lngs) + Math.max.apply(null,lngs)) / 2;
        zoom = 13;
        loadedTiles = {};
        tileLayer.innerHTML = '';
      }
    } else {
      var rcfg = CITY_CONFIG[currentCity];
      centerLat = rcfg.lat; centerLng = rcfg.lng; zoom = rcfg.zoom;
      loadedTiles = {};
      tileLayer.innerHTML = '';
    }
    render();
  });
});

// Create BAC map pins (render into same markerLayer)
BAC.forEach(function(b) {
  var pin = document.createElement('div');
  pin.className = 'bpin bpin-hidden';
  pin.id = 'bpin-' + b.id;
  pin.innerHTML =
    '<div class="bpin-dot">🎨</div>' +
    '<div class="bpin-label">' + b.title + '</div>';
  pin.addEventListener('click', function(e) {
    e.stopPropagation();
    showBACPopup(b);
  });
  markerLayer.appendChild(pin);
});

function renderBACMarkers() {
  if (!BAC_ACTIVE) return;
  var cWX = lngToWX(centerLng);
  var cWY = latToWY(centerLat);
  var W = wrap.clientWidth, H = wrap.clientHeight;
  BAC.forEach(function(b) {
    var pin = document.getElementById('bpin-' + b.id);
    if (!pin || pin.classList.contains('bpin-hidden')) return;
    var sx = lngToWX(b.lng) - cWX + W / 2;
    var sy = latToWY(b.lat) - cWY + H / 2;
    pin.style.left = sx + 'px';
    pin.style.top  = sy + 'px';
  });
}

// Patch render() to also position BAC markers
var _origRender = render;
render = function() {
  _origRender();
  renderBACMarkers();
};

function showBACPopup(b) {
  popupImg.src = '';
  popupImg.style.display = 'none';
  popupTitle.textContent = b.title;
  popupMeta.innerHTML =
    '<span>🕐 ' + b.time + '</span>' +
    '<span>📍 ' + b.loc + '</span>' +
    '<span style="color:#f87171;font-weight:700">🗺 BAC Passport Trail</span>' +
    '<span style="color:#f87171">📍 ' + b.zone + '</span>' +
    '<span style="color:#6b7280">📅 Until May 31, 2026</span>';
  var pin = document.getElementById('bpin-' + b.id);
  var pw = 240, ph = 150;
  var W = wrap.clientWidth, H = wrap.clientHeight;
  var px = parseFloat(pin.style.left);
  var py = parseFloat(pin.style.top);
  var left = px + 20;
  var top  = py - ph / 2;
  if (left + pw > W - 10) left = px - pw - 20;
  if (top < 10) top = 10;
  if (top + ph > H - 10) top = H - ph - 10;
  popup.style.left = left + 'px';
  popup.style.top  = top + 'px';
  popup.style.display = 'block';
}

// BAC Trail toggle pill
var bacPill = document.querySelector('.pill[data-f="bac"]');
if (bacPill) {
  if (!BAC_ACTIVE) {
    bacPill.style.display = 'none';
  } else {
    bacPill.addEventListener('click', function(e) {
      e.stopPropagation(); // don't trigger the main pill handler
      bacVisible = !bacVisible;
      bacPill.classList.toggle('on', bacVisible);
      BAC.forEach(function(b) {
        var pin = document.getElementById('bpin-' + b.id);
        if (pin) pin.classList.toggle('bpin-hidden', !bacVisible);
      });
      if (bacVisible) {
        // Zoom to show all BAC venues
        var lats = BAC.map(function(b) { return b.lat; });
        var lngs = BAC.map(function(b) { return b.lng; });
        centerLat = (Math.min.apply(null,lats) + Math.max.apply(null,lats)) / 2;
        centerLng = (Math.min.apply(null,lngs) + Math.max.apply(null,lngs)) / 2;
        zoom = 13;
        loadedTiles = {};
        tileLayer.innerHTML = '';
      }
      render();
    });
  }
}
