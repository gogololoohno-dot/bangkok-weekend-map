<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onchain Inference Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fff; --ink:#111; --gray:#6b6b6b; --line:#d9d9d9; --grid:#ececec; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'Archivo',sans-serif; }
  .wrap { max-width:1480px; margin:0 auto; padding:0 28px 80px; }
  header { display:flex; align-items:flex-end; gap:24px; padding:34px 0 10px; flex-wrap:wrap; }
  h1 { font-family:'Anton',sans-serif; font-size:clamp(40px,5.5vw,76px); line-height:.92; text-transform:uppercase; font-weight:400; }
  .sub { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gray); margin-top:8px; }
  .spacer { flex:1; }
  .ranges { display:flex; gap:6px; padding-bottom:6px; }
  .tbtn { border:1.5px solid var(--ink); background:var(--paper); color:var(--ink); font:700 10px/1 'Archivo'; letter-spacing:.1em; text-transform:uppercase; padding:10px 14px; cursor:pointer; }
  .tbtn.on, .tbtn:hover { background:var(--ink); color:var(--paper); }

  .strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin:18px 0 34px; }
  .tile { border:1.5px solid var(--ink); padding:12px 14px; cursor:pointer; user-select:none; }
  .tile.off { opacity:.35; }
  .tile .name { display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; }
  .sw { width:12px; height:12px; border-radius:2px; flex:none; }
  .tile .badge { margin-left:auto; font-size:9px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--gray); color:var(--gray); padding:2px 5px; }
  .tile .badge.scrape { border-style:dashed; }
  .tile .big { font-family:'Anton'; font-size:26px; margin-top:8px; }
  .tile .meta { font-size:10px; color:var(--gray); margin-top:4px; letter-spacing:.06em; text-transform:uppercase; }
  .up { color:#087f3f; } .dn { color:#c1121f; }

  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(560px,1fr)); gap:28px 40px; }
  .chart h2 { font-family:'Anton'; font-size:20px; text-transform:uppercase; letter-spacing:.02em; }
  .chart .note { font-size:11px; color:var(--gray); margin:2px 0 12px; min-height:28px; }
  .chart .absent { font-size:10px; color:var(--gray); letter-spacing:.08em; text-transform:uppercase; margin-top:8px; }
  .hdr, .row { display:grid; grid-template-columns:22px 150px 1fr 84px 52px 62px 44px; gap:10px; align-items:center; }
  .hdr { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--gray); padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .row { padding:5px 0; font-size:12px; }
  .row .rk { font-family:'Anton'; font-size:14px; color:var(--gray); }
  .row .lbl { display:flex; align-items:center; gap:8px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .bar { height:18px; background:var(--grid); position:relative; }
  .row .bar .fill { position:absolute; inset:0 auto 0 0; }
  .row .bar .fill.snapshot { background-image:repeating-linear-gradient(135deg, transparent 0 4px, rgba(255,255,255,.45) 4px 7px); }
  .row .val { font-family:'Anton'; font-size:15px; text-align:right; }
  .row .share, .row .chg, .row .cov { text-align:right; font-size:11px; }
  .row .share, .row .cov { color:var(--gray); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Onchain Inference</h1>
      <div class="sub" id="gen">loading…</div>
    </div>
    <div class="spacer"></div>
    <div class="ranges" id="ranges">
      <button class="tbtn" data-days="7">7d</button>
      <button class="tbtn on" data-days="30">30d</button>
      <button class="tbtn" data-days="90">90d</button>
      <button class="tbtn" data-days="0">All</button>
    </div>
  </header>
  <div class="strip" id="strip"></div>
  <div class="charts" id="charts"></div>
</div>

<script>
const COLORS = { chutes:'#111111', antseed:'#c1121f', surplus:'#1d4ed8', engy:'#e08a00',
                 gm:'#059669', blockrun:'#db2777' };
const SNAPSHOT = new Set(['blockrun']);     // hatched: rolling-24h figures, not calendar days
const CHARTS = [
  { key:'requests', title:'Requests / day', money:false,
    note:'Average per day over the days each player reports in range. BlockRun is a rolling 24h snapshot (hatched).' },
  { key:'tokens', title:'Tokens / day', money:false,
    note:'Input + output (+ cache where reported). Surplus cache tokens are prompt tokens served from cache.' },
  { key:'spend', title:'Buyer spend / day (USD)', money:true,
    note:'What demand paid. Chutes: buyer USD. AntSeed: settlement GMV. gm: traffic value served.' },
  { key:'capture', title:'Protocol capture / day (USD)', money:true,
    note:'What the network kept. AntSeed: fees. Engy: SN53 miner emissions — issuance, not buyer money.' },
  { key:'tokens_per_request', title:'Tokens per request', money:false, ratio:true,
    note:'Σ tokens ÷ Σ requests over the range. Workload shape — separates chat routers from long-context / agent traffic. Not additive, so no share.' },
];

let DATA, days = 30, hidden = new Set();

const fmt = (v) => {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e12) return (v/1e12).toFixed(2)+'T';
  if (a >= 1e9)  return (v/1e9).toFixed(2)+'B';
  if (a >= 1e6)  return (v/1e6).toFixed(2)+'M';
  if (a >= 1e3)  return (v/1e3).toFixed(1)+'K';
  return v >= 100 ? v.toFixed(0) : v.toFixed(2);
};
const usd = (v) => v == null ? '—' : '$' + fmt(v);
const pct = (v) => v == null ? '' : `<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${v.toFixed(0)}%</span>`;

function cutoff() {
  if (!days) return '';
  const c = new Date(); c.setUTCDate(c.getUTCDate() - days);
  return c.toISOString().slice(0,10);
}
const inRange = (series) => series.filter(([d]) => d >= cutoff());
const sum = (series) => series.reduce((a, [,v]) => a + v, 0);

// 7-day momentum: mean of the last 7 points vs the 7 before, over the player's full series
function momentum(series) {
  if (series.length < 14) return null;
  const a = sum(series.slice(-7)) / 7, b = sum(series.slice(-14, -7)) / 7;
  return b ? (a/b - 1) * 100 : null;
}

function renderStrip() {
  const el = document.getElementById('strip'); el.innerHTML = '';
  for (const [p, info] of Object.entries(DATA.players)) {
    const req = DATA.charts.requests[p] || [];
    const spend = DATA.charts.spend[p] || [];
    const cap = DATA.charts.capture[p] || [];
    const main = req.length ? req : (spend.length ? spend : cap);
    const isMoney = !req.length;
    const last = main[main.length-1];
    let chg = momentum(main);
    if (chg != null && Math.abs(chg) < 0.5) chg = 0;
    const tile = document.createElement('div');
    tile.className = 'tile' + (hidden.has(p) ? ' off' : '');
    tile.innerHTML = `
      <div class="name"><span class="sw" style="background:${COLORS[p]}"></span>${info.label}
        <span class="badge ${info.kind}">${info.kind}</span></div>
      <div class="big">${last ? (isMoney ? usd(last[1]) : fmt(last[1])) : '—'}</div>
      <div class="meta">latest ${req.length ? 'req/day' : (spend.length ? 'spend/day' : 'capture/day')}
        ${chg == null ? '' : '· ' + pct(chg) + ' 7d'}</div>
      <div class="meta">through ${DATA.through[p] || '—'}</div>`;
    tile.onclick = () => { hidden.has(p) ? hidden.delete(p) : hidden.add(p); render(); };
    el.appendChild(tile);
  }
}

// One ranked row per player: value = per-day average over the days it reports in range.
function rankRows(cfg) {
  const data = DATA.charts[cfg.key] || {};
  const rows = [];
  for (const p of Object.keys(DATA.players)) {
    if (hidden.has(p)) continue;
    let value, cov;
    if (cfg.ratio) {
      const t = inRange(DATA.charts.tokens[p] || []), r = inRange(DATA.charts.requests[p] || []);
      const rd = new Map(r); const paired = t.filter(([d]) => rd.has(d));
      cov = paired.length;
      value = cov ? sum(paired) / sum(paired.map(([d]) => [d, rd.get(d)])) : null;
    } else {
      const s = inRange(data[p] || []);
      cov = s.length;
      value = cov ? sum(s) / cov : null;
    }
    if (value == null) continue;
    rows.push({ p, value, cov, chg: momentum(data[p] || []) });
  }
  rows.sort((a, b) => b.value - a.value);
  return rows;
}

function renderChart(cfg) {
  const box = document.createElement('div'); box.className = 'chart';
  const rows = rankRows(cfg);
  const present = new Set(rows.map(r => r.p));
  const absent = Object.keys(DATA.players).filter(p => !present.has(p) && !hidden.has(p));
  const f = cfg.money ? usd : fmt;
  const max = rows.length ? rows[0].value : 1;
  const total = cfg.ratio ? null : rows.reduce((a, r) => a + r.value, 0);

  let html = `<h2>${cfg.title}</h2><div class="note">${cfg.note}</div>`;
  if (!rows.length) html += '<div class="absent">no data in range</div>';
  else {
    html += `<div class="hdr"><span>#</span><span>player</span><span></span><span>avg/day</span><span>share</span><span>7d</span><span>days</span></div>`;
    rows.forEach((r, i) => {
      const w = Math.max(1.5, r.value / max * 100);
      html += `<div class="row">
        <div class="rk">${i+1}</div>
        <div class="lbl"><span class="sw" style="background:${COLORS[r.p]}"></span>${DATA.players[r.p].label}</div>
        <div class="bar"><div class="fill${SNAPSHOT.has(r.p)?' snapshot':''}" style="width:${w}%;background:${COLORS[r.p]}"></div></div>
        <div class="val">${f(r.value)}</div>
        <div class="share">${total ? (r.value/total*100).toFixed(0)+'%' : '—'}</div>
        <div class="chg">${pct(r.chg)}</div>
        <div class="cov">${r.cov}d</div>
      </div>`;
    });
  }
  if (absent.length) html += `<div class="absent">not reported: ${absent.map(p => DATA.players[p].label).join(' · ')}</div>`;
  box.innerHTML = html;
  return box;
}

function render() {
  renderStrip();
  const root = document.getElementById('charts'); root.innerHTML = '';
  for (const cfg of CHARTS) root.appendChild(renderChart(cfg));
}

document.getElementById('ranges').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  days = +b.dataset.days;
  document.querySelectorAll('#ranges .tbtn').forEach(x => x.classList.toggle('on', x === b));
  render();
};

fetch('data.json').then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById('gen').textContent = `generated ${d.generated_at.replace('T',' ').slice(0,16)} UTC · ${Object.keys(d.players).length} players · ranked by per-day average in range · click a tile to toggle`;
  render();
}).catch(err => { document.getElementById('gen').textContent = 'data.json missing — run scrape.py then build.py'; console.error(err); });
</script>
</body>
</html>
