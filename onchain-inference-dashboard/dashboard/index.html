<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onchain Inference Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fff; --ink:#111; --gray:#6b6b6b; --line:#d9d9d9; --grid:#ececec; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'Archivo',sans-serif; }
  .wrap { max-width:1480px; margin:0 auto; padding:0 28px 80px; }
  header { display:flex; align-items:flex-end; gap:24px; padding:34px 0 10px; flex-wrap:wrap; }
  h1 { font-family:'Anton',sans-serif; font-size:clamp(40px,5.5vw,76px); line-height:.92; text-transform:uppercase; font-weight:400; }
  .sub { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gray); margin-top:8px; }
  .spacer { flex:1; }
  .ranges { display:flex; gap:6px; padding-bottom:6px; }
  .tbtn { border:1.5px solid var(--ink); background:var(--paper); color:var(--ink); font:700 10px/1 'Archivo'; letter-spacing:.1em; text-transform:uppercase; padding:10px 14px; cursor:pointer; }
  .tbtn.on, .tbtn:hover { background:var(--ink); color:var(--paper); }

  .strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; margin:18px 0 34px; }
  .tile { border:1.5px solid var(--ink); padding:12px 14px; cursor:pointer; user-select:none; }
  .tile.off { opacity:.35; }
  .tile .name { display:flex; align-items:center; gap:8px; font-weight:700; font-size:13px; }
  .sw { width:12px; height:12px; border-radius:2px; flex:none; }
  .tile .badge { margin-left:auto; font-size:9px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--gray); color:var(--gray); padding:2px 5px; }
  .tile .badge.scrape { border-style:dashed; }
  .tile .big { font-family:'Anton'; font-size:26px; margin-top:8px; }
  .tile .meta { font-size:10px; color:var(--gray); margin-top:4px; letter-spacing:.06em; text-transform:uppercase; }
  .up { color:#087f3f; } .dn { color:#c1121f; }

  .chart { margin-bottom:40px; }
  .chart h2 { font-family:'Anton'; font-size:20px; text-transform:uppercase; letter-spacing:.02em; }
  .chart .note { font-size:11px; color:var(--gray); margin:2px 0 10px; }
  .chart .absent { font-size:10px; color:var(--gray); letter-spacing:.08em; text-transform:uppercase; margin-top:6px; }
  .body { display:grid; grid-template-columns:1fr 250px; gap:20px; align-items:start; }
  svg { width:100%; height:300px; display:block; overflow:visible; }
  .gridline { stroke:var(--grid); stroke-width:1; }
  .axis { font-size:10px; fill:var(--gray); font-family:'Archivo'; }
  .seg { transition:opacity .08s; }
  .dim .seg { opacity:.3; }
  .dim .seg.hot { opacity:1; }
  .panel { border:1.5px solid var(--ink); padding:12px 14px; font-size:12px; }
  .panel .when { font-family:'Anton'; font-size:15px; letter-spacing:.03em; margin-bottom:8px; }
  .panel .when small { font-family:'Archivo'; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--gray); margin-left:6px; }
  .panel .pr { display:flex; align-items:center; gap:8px; padding:3px 0; }
  .panel .pr .lbl { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel .pr .v { font-family:'Anton'; font-size:14px; }
  .panel .tot { border-top:1px solid var(--line); margin-top:6px; padding-top:6px; font-weight:700; }
  .panel .tot .v { font-size:16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Onchain Inference</h1>
      <div class="sub" id="gen">loading…</div>
    </div>
    <div class="spacer"></div>
    <div class="ranges" id="ranges">
      <button class="tbtn" data-days="30">30d</button>
      <button class="tbtn on" data-days="90">90d</button>
      <button class="tbtn" data-days="0">All · weekly</button>
    </div>
  </header>
  <div class="strip" id="strip"></div>
  <div id="charts"></div>
</div>

<script>
const COLORS = { chutes:'#111111', antseed:'#c1121f', surplus:'#1d4ed8', engy:'#e08a00',
                 gm:'#059669' };
const CHARTS = [
  { key:'requests', title:'Requests', money:false,
    note:'Stacked per period. Chutes, AntSeed, Surplus, Engy: calendar-day totals. gm: epoch rollup.' },
  { key:'tokens', title:'Tokens', money:false,
    note:'Input + output (+ cache where reported). Surplus cache tokens are prompt tokens served from cache.' },
  { key:'spend', title:'Buyer spend (USD)', money:true,
    note:'What demand paid. Chutes: buyer USD. AntSeed: settlement GMV. gm: traffic value served.' },
  { key:'capture', title:'Protocol capture (USD)', money:true,
    note:'What the network kept. AntSeed: fees. Engy: SN53 miner emissions — issuance, not buyer money.' },
  { key:'tokens_per_request', title:'Tokens per request', money:false, grouped:true,
    note:'Σ tokens ÷ Σ requests per period, one bar per player (not additive, so not stacked). Workload shape.' },
];
const M = { t:12, r:8, b:26, l:58 };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let DATA, days = 90, hidden = new Set();
const weekly = () => days === 0;

const fmt = (v) => {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e12) return (v/1e12).toFixed(2)+'T';
  if (a >= 1e9)  return (v/1e9).toFixed(2)+'B';
  if (a >= 1e6)  return (v/1e6).toFixed(2)+'M';
  if (a >= 1e3)  return (v/1e3).toFixed(1)+'K';
  return v >= 100 ? v.toFixed(0) : v.toFixed(2);
};
const usd = (v) => v == null ? '—' : '$' + fmt(v);
const pct = (v) => v == null ? '' : `<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${v.toFixed(0)}%</span>`;
const dshort = (day) => { const d = new Date(day+'T00:00:00Z'); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const dlong = (day) => { const d = new Date(day+'T00:00:00Z'); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const addDays = (day, n) => { const d = new Date(day+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };

function cutoff() {
  if (!days) return '';
  const c = new Date(); c.setUTCDate(c.getUTCDate() - days);
  return c.toISOString().slice(0,10);
}
// Bucket key: the day itself, or the Monday of its ISO week.
function bucketOf(day) {
  if (!weekly()) return day;
  const d = new Date(day+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7);
  return d.toISOString().slice(0,10);
}
const bucketLabel = (k) => weekly() ? `${dshort(k)} – ${dshort(addDays(k,6))}` : dlong(k);

const sum = (series) => series.reduce((a, [,v]) => a + v, 0);
function momentum(series) {
  if (series.length < 14) return null;
  const a = sum(series.slice(-7)) / 7, b = sum(series.slice(-14, -7)) / 7;
  return b ? (a/b - 1) * 100 : null;
}

function renderStrip() {
  const el = document.getElementById('strip'); el.innerHTML = '';
  for (const [p, info] of Object.entries(DATA.players)) {
    const req = DATA.charts.requests[p] || [];
    const spend = DATA.charts.spend[p] || [];
    const cap = DATA.charts.capture[p] || [];
    const main = req.length ? req : (spend.length ? spend : cap);
    const isMoney = !req.length;
    const last = main[main.length-1];
    let chg = momentum(main);
    if (chg != null && Math.abs(chg) < 0.5) chg = 0;
    const tile = document.createElement('div');
    tile.className = 'tile' + (hidden.has(p) ? ' off' : '');
    tile.innerHTML = `
      <div class="name"><span class="sw" style="background:${COLORS[p]}"></span>${info.label}
        <span class="badge ${info.kind}">${info.kind}</span></div>
      <div class="big">${last ? (isMoney ? usd(last[1]) : fmt(last[1])) : '—'}</div>
      <div class="meta">latest ${req.length ? 'req/day' : (spend.length ? 'spend/day' : 'capture/day')}
        ${chg == null ? '' : '· ' + pct(chg) + ' 7d'}</div>
      <div class="meta">through ${DATA.through[p] || '—'}</div>`;
    tile.onclick = () => { hidden.has(p) ? hidden.delete(p) : hidden.add(p); render(); };
    el.appendChild(tile);
  }
}

// -> { keys:[bucket...], val:{bucket:{player:v}}, ndays:{bucket:Set(day)}, players:[stack order] }
function buckets(cfg) {
  const cut = cutoff();
  const players = Object.keys(DATA.players).filter(p => !hidden.has(p));
  const val = {}, ndays = {}, tok = {}, req = {};
  const add = (store, b, p, v) => { (store[b] ||= {})[p] = (store[b][p] || 0) + v; };
  for (const p of players) {
    if (cfg.grouped) {
      for (const [d, v] of DATA.charts.tokens[p] || []) if (d >= cut) { add(tok, bucketOf(d), p, v); (ndays[bucketOf(d)] ||= new Set()).add(d); }
      for (const [d, v] of DATA.charts.requests[p] || []) if (d >= cut) add(req, bucketOf(d), p, v);
    } else {
      for (const [d, v] of DATA.charts[cfg.key][p] || []) if (d >= cut) { add(val, bucketOf(d), p, v); (ndays[bucketOf(d)] ||= new Set()).add(d); }
    }
  }
  if (cfg.grouped) for (const b of Object.keys(tok)) for (const p of Object.keys(tok[b])) if (req[b]?.[p]) add(val, b, p, tok[b][p] / req[b][p]);
  const keys = Object.keys(val).sort();
  const totals = {}; for (const b of keys) for (const [p, v] of Object.entries(val[b])) totals[p] = (totals[p] || 0) + v;
  const order = players.filter(p => totals[p]).sort((a, b) => totals[b] - totals[a]);   // biggest at the bottom
  return { keys, val, ndays, players: order };
}

function renderChart(cfg) {
  const box = document.createElement('div'); box.className = 'chart';
  const B = buckets(cfg);
  const absent = Object.keys(DATA.players).filter(p => !hidden.has(p) && !B.players.includes(p));
  const f = cfg.money ? usd : fmt;
  box.innerHTML = `<h2>${cfg.title}</h2><div class="note">${cfg.note}</div>`;
  if (!B.keys.length) { box.innerHTML += '<div class="absent">no data in range</div>'; return box; }

  const W = 1200, H = 300, iw = W - M.l - M.r, ih = H - M.t - M.b;
  const n = B.keys.length, slot = iw / n, bw = Math.max(1, slot * (weekly() ? 0.78 : 0.72));
  const top = Math.max(...B.keys.map(b => cfg.grouped
    ? Math.max(...Object.values(B.val[b]))
    : Object.values(B.val[b]).reduce((a, v) => a + v, 0))) * 1.05 || 1;
  const y = (v) => M.t + ih - v / top * ih;

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><pattern id="hatch-${cfg.key}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fff" opacity="0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-width="3" opacity=".55"/></pattern></defs>`;
  for (let i = 0; i <= 4; i++) { const v = top * i / 4;
    svg += `<line class="gridline" x1="${M.l}" x2="${W-M.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${M.l-6}" y="${y(v)+3}" text-anchor="end">${f(v)}</text>`; }
  const step = Math.max(1, Math.ceil(n / 9));
  B.keys.forEach((b, i) => {
    const x0 = M.l + i * slot + (slot - bw) / 2;
    if (i % step === 0) svg += `<text class="axis" x="${x0 + bw/2}" y="${H-8}" text-anchor="middle">${dshort(b)}</text>`;
    const partial = weekly() && i === n-1 && B.ndays[b].size < 7;
    if (cfg.grouped) {
      const ps = B.players.filter(p => B.val[b][p] != null), gw = bw / Math.max(1, ps.length);
      ps.forEach((p, j) => { const v = B.val[b][p];
        svg += `<rect class="seg" data-i="${i}" x="${x0 + j*gw}" y="${y(v)}" width="${Math.max(0.5, gw-1)}" height="${ih - (y(v)-M.t)}" fill="${COLORS[p]}"/>`; });
    } else {
      let acc = 0;
      for (const p of B.players) { const v = B.val[b][p]; if (!v) continue;
        svg += `<rect class="seg" data-i="${i}" x="${x0}" y="${y(acc+v)}" width="${bw}" height="${y(acc)-y(acc+v)}" fill="${COLORS[p]}"/>`; acc += v; }
      if (partial) svg += `<rect data-i="${i}" x="${x0}" y="${y(acc)}" width="${bw}" height="${ih-(y(acc)-M.t)}" fill="url(#hatch-${cfg.key})" pointer-events="none"/>`;
    }
    svg += `<rect data-hit="${i}" x="${M.l + i*slot}" y="${M.t}" width="${slot}" height="${ih}" fill="transparent"/>`;
  });
  svg += '</svg>';

  const body = document.createElement('div'); body.className = 'body';
  body.innerHTML = svg + '<div class="panel"></div>';
  box.appendChild(body);
  if (absent.length) box.innerHTML += `<div class="absent">not reported: ${absent.map(p => DATA.players[p].label).join(' · ')}</div>`;

  const svgEl = box.querySelector('svg'), panel = box.querySelector('.panel');
  const show = (i) => {
    const b = B.keys[i], rows = B.players.map(p => [p, B.val[b][p]]).filter(([,v]) => v != null).sort((a, c) => c[1] - a[1]);
    const partial = weekly() && i === n-1 && B.ndays[b].size < 7;
    let h = `<div class="when">${bucketLabel(b)}${partial ? `<small>${B.ndays[b].size} of 7 days</small>` : ''}</div>`;
    for (const [p, v] of rows) h += `<div class="pr"><span class="sw" style="background:${COLORS[p]}"></span><span class="lbl">${DATA.players[p].label}</span><span class="v">${f(v)}</span></div>`;
    if (!cfg.grouped) h += `<div class="pr tot"><span class="lbl">Total</span><span class="v">${f(rows.reduce((a, [,v]) => a + v, 0))}</span></div>`;
    panel.innerHTML = h;
    svgEl.classList.toggle('dim', i !== n-1 || svgEl.matches(':hover'));
    svgEl.querySelectorAll('.seg').forEach(s => s.classList.toggle('hot', +s.dataset.i === i));
  };
  svgEl.addEventListener('mousemove', (e) => { const t = e.target.closest('[data-hit],[data-i]'); if (t) show(+(t.dataset.hit ?? t.dataset.i)); });
  svgEl.addEventListener('mouseleave', () => { svgEl.classList.remove('dim'); show(n-1); });
  show(n-1); svgEl.classList.remove('dim');
  return box;
}

function render() {
  renderStrip();
  const root = document.getElementById('charts'); root.innerHTML = '';
  for (const cfg of CHARTS) root.appendChild(renderChart(cfg));
}

document.getElementById('ranges').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  days = +b.dataset.days;
  document.querySelectorAll('#ranges .tbtn').forEach(x => x.classList.toggle('on', x === b));
  render();
};

fetch('data.json').then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById('gen').textContent = `generated ${d.generated_at.replace('T',' ').slice(0,16)} UTC · ${Object.keys(d.players).length} players · hover a bar for the breakdown · click a tile to toggle`;
  render();
}).catch(err => { document.getElementById('gen').textContent = 'data.json missing — run scrape.py then build.py'; console.error(err); });
</script>
</body>
</html>
